<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="redRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e27"/>
      <stop offset="100%" stop-color="#b81d24"/>
    </linearGradient>
    <linearGradient id="redRibbon2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#80060c"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#e50914" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Subtle Radial Glow behind R -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)"/>

  <!-- Iconic 3D Folded Ribbon R -->
  <g filter="url(#shadow)">
    <!-- Left Vertical Stem -->
    <path d="M 130 110 L 195 110 L 195 402 L 130 402 Z" fill="url(#redRibbon1)"/>
    
    <!-- Top Arc & Loop of R -->
    <path d="M 195 110 L 290 110 C 365 110 400 150 400 215 C 400 280 355 315 285 315 L 195 315 Z" fill="url(#redRibbon2)"/>
    <!-- Inner Cutout for Loop -->
    <path d="M 195 170 L 280 170 C 315 170 335 188 335 215 C 335 242 315 258 280 258 L 195 258 Z" fill="#0c0d10"/>

    <!-- Right Leg of R with Dynamic Forward Kick -->
    <path d="M 255 285 L 340 402 L 415 402 L 320 270 Z" fill="url(#redRibbon1)"/>
  </g>

  <!-- Play Symbol Overlay inside Loop -->
  <polygon points="245,195 245,235 280,215" fill="#ffffff" opacity="0.95"/>
</svg>
