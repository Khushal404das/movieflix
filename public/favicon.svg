<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="50%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="redBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4151c"/>
      <stop offset="100%" stop-color="#6e070c"/>
    </linearGradient>
    <linearGradient id="redDiagLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2b33"/>
      <stop offset="100%" stop-color="#b81219"/>
    </linearGradient>
    <linearGradient id="redDiagRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#96080e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#e50914" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#canvasBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Subtle Center Red Radial Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- 3D Ribbon 'M' Symbol for MovieFlix -->
  <g filter="url(#dropShadow)">
    <!-- Back Vertical Pillars -->
    <!-- Left Pillar -->
    <path d="M 104 116 L 168 116 L 168 396 L 104 396 Z" fill="url(#redBack)"/>
    <!-- Right Pillar -->
    <path d="M 344 116 L 408 116 L 408 396 L 344 396 Z" fill="url(#redBack)"/>

    <!-- Front Folded Diagonal Ribbons -->
    <!-- Left Diagonal -->
    <path d="M 104 116 L 180 116 L 276 324 L 236 324 Z" fill="url(#redDiagLeft)" filter="url(#foldShadow)"/>
    <!-- Right Diagonal -->
    <path d="M 408 116 L 332 116 L 236 324 L 276 324 Z" fill="url(#redDiagRight)" filter="url(#foldShadow)"/>
  </g>

  <!-- Cinema Play Triangle Badge under center fold -->
  <g filter="url(#foldShadow)">
    <circle cx="256" cy="380" r="24" fill="#1a1a20" stroke="rgba(229,9,20,0.6)" stroke-width="2"/>
    <polygon points="251,370 251,390 266,380" fill="#ffffff"/>
  </g>
</svg>