name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: reelhouse_flutter
        run: flutter pub get

      - name: Build Android APK
        working-directory: reelhouse_flutter
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: reelhouse-android-release-apk
          path: reelhouse_flutter/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: reelhouse_flutter
        run: flutter pub get

      - name: Build iOS (No Codesign)
        working-directory: reelhouse_flutter
        run: flutter build ios --no-codesign --release

      - name: Compress iOS Payload
        run: |
          cd reelhouse_flutter/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r reelhouse-ios.ipa Payload/

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: reelhouse-ios-app
          path: reelhouse_flutter/build/ios/iphoneos/reelhouse-ios.ipa
